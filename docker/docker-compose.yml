services:
  mongodb:
    image: mongo:8.2.6-rc0-noble
    
    container_name: mongodb

    ports:
      - "27007:27017"
    volumes:
      - mongodata:/data/db

    environment:
    - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
    - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}

    networks:
      - backend

    restart: always
  
networks:
  backend:

volumes:
  mongodata: